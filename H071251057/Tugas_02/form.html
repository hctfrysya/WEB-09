<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Kawah Putih</h1>

    <h2>Rencana Kunjungan</h2>
    <p>Isi form di bawah ini untuk merencanakan kunjungan Anda ke Kawah Putih.</p>

    <form>
        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>

        <br><br>

        <label for="tanggal">Tanggal Kunjungan:</label>
        <input type="date" id="tanggal" name="tanggal" required>

        <br><br>

        <label for="jumlah">Jumlah Pengunjung:</label>
        <input type="number" id="jumlah" name="jumlah" min="1" placeholder="Masukkan jumlah pengunjung" required>

        <br><br>
        
        <input type="submit" value="Kirim Data Kunjungan">
    </form>
</body>
</html>
